name: Weekly Paper Digest

on:
  schedule:
    # 매주 월요일 00:15 UTC = 한국시간 월요일 오전 9시 15분경.
    # 정각(00:00)은 전 세계 cron이 몰려 지연이 심하므로 살짝 비켜둠.
    # (그래도 GitHub 예약 실행은 정시 보장이 아니라 수십 분 지연될 수 있음)
    - cron: "15 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-genai

      - name: Fetch papers and update README
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_papers.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "변경 사항이 없습니다."
            exit 0
          fi
          git add README.md
          git commit -m "Weekly paper digest: $(date -u +%Y-%m-%d)"
          # 원격이 그사이 진행됐을 수 있으니 rebase 후 재시도 (push 경합 방지)
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 실패, 원격 변경사항 rebase 후 재시도 ($i)..."
            git pull --rebase origin main
          done
          echo "여러 번 시도 후에도 push 실패"
          exit 1
